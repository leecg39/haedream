name: CI

on:
  pull_request:
  push:
    branches: [feat/fit-clone, main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run check:public-data
      - run: npm audit --omit=dev

  e2e-core:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Core Playwright E2E
        env:
          E2E_PORT: "3470"
          CI: "true"
        run: >
          npx playwright test
          e2e/fit-auth.spec.ts
          e2e/watt-firm.spec.ts
          e2e/firm-mobile-a11y.spec.ts
          e2e/fit-research.spec.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
