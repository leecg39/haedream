<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>사용자관리</title>
    <link rel="shortcut icon" href="./assets/img/favicon.ico">
    <link rel="stylesheet" href="./assets/css/lib/tui-date-picker.css">
    <script src="./assets/js/lib/tui-date-picker.js"></script>
    <script src="./assets/js/lib/xlsx.full.min.js"></script>
    <link href="./assets/css/lib/select2.min.css" rel="stylesheet">
    <script src="./assets/js/jquery.min.js"></script>
    <script src="./assets/js/lib/select2.min.js"></script>
    <link rel="stylesheet" type="text/css" href="./assets/css/common.css?v=0.0.1">
    <link rel="stylesheet" type="text/css" href="./assets/css/deskLib.css?v=0.0.1">
    <script type="text/javascript" src="./assets/js/base.js?v=0.0.1"></script>
    <script type="text/javascript" src="./assets/js/user.js?v=0.0.2"></script>
</head>
<body id="dashboard" class="darkmode">
<div class="mobileOverlay">
    <div class="mobileBg"></div>
    <div class="mobileNavbg"></div>
</div>
<div class="container">
    <div class="bdRight" id="leftnav"></div>
    <div class="contentsArea">
        <div class="topBar" id="topBar"></div>
        <main class="contents disable" id="contentsArea">
            <h1 class="deskTitle">사용자관리</h1>
            <div class="sheetArea setSub">
                <div class="deskStat">
                    <!-- <div class="deskLimit">
                        <span class="deskLabel" id="deskLimit">1 - 5 / 5</span>
                    </div> -->
                    <div class="deskTool" id="deskTool">
                        <span class="deskAct act" data-act="add">
                            <i class="bi bi-person-plus-fill"></i>추가
                        </span>
                        <span class="deskAct act" data-act="excel">
                            <i class="bi bi-file-earmark-excel-fill excel"></i>엑셀로 다운
                        </span>
                        <span class="deskAct act" data-act="print">
                            <i class="bi bi-printer"></i>프린트
                        </span>
                    </div>
                    <div class="deskPages">
                <span class="deskSearch">
                    <input class="deskInput" id="deskInput" maxlength="16" placeholder="검색" autocomplete="one-time-code">
                    <i class="icon iconSearch"></i>
                </span>
                    </div>
                </div>
                <div class="deskArea">
                    <table class="desk" id="deskTable">
                        <thead>
                        <tr id="deskSort">
                            <th class="sort" data-sort="firmName">이름</th>
                            <th class="sort" data-sort="bone">아이디</th>
                            <th>권한</th>
                            <th class="sort" data-sort="part">부서</th>
                            <th>연락처</th>
                            <th>접속일자</th>
                        </tr>
                        </thead>
                        <tbody id="deskList">
                        <tr>
                            <td>-</td>
                            <td>-</td>
                            <td>-</td>
                            <td>-</td>
                            <td>-</td>
                            <td>-</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
                <div class="deskStat">
                    <div class="deskLimit">
                        <span class="deskLabel" id="deskStat">1 - 5 / 5</span>
                    </div>
                    <div class="deskPages" id="deskPages">
                        <span class="deskPage act">prev</span>
                        <span class="deskPage act active">1</span>
                        <span class="deskPage act">next</span>
                    </div>
                </div>
            </div>
        </main>
        <div class="disable" id="modal">
            <div class="modal">
                <div class="modalBox">
                    <i class="modalClose" id="modalActClose"></i>
                    <div class="modalContent">
                        <div class="editTitle">사용자관리</div>
                        <div class="editForm">
                            <span>권한</span>
                            <span>
                                <select class="eSelect" id="edit-userType">
                                    <option value="0">일반사용자</option>
                                    <option value="1">관리자</option>
                                    <option value="2">저압관리자</option>
                                </select>
                            </span>
                            <span>부서</span>
                            <span>
                                <input class="eInput" id="edit-part" maxlength="16" />
                            </span>
                            <span>이름</span>
                            <span>
                                <input class="eInput" id="edit-manager" maxlength="16" />
                            </span>
                            <span>아이디</span>
                            <span>
                                <input class="eInput" id="edit-bone" maxlength="16"/>
                            </span>
                            <span>연락처</span>
                            <span>
                                <input class="eInput" id="edit-phone" maxlength="16"/>
                            </span>
                            <span>비밀번호</span>
                            <span>
                                <input type="password" class="eInput" id="edit-passwd" maxlength="16"/>
                            </span>
                            <span></span>
                            <span></span>
                            <span></span>
                            <span>※ 영문, 숫자, 특수문자 포함 8자리</span>
                        </div>
                    </div>
                    <div class="modalTool">
                        <span class="modalAct cancel" id="modalActCancel">취소</span>
                        <span class="modalAct" id="modalActDone">확인</span>
                    </div>
                </div>
            </div>
        </div>
        <div class="disable" id="modalSafe">
            <div class="modal">
                <div class="modalBox">
                    <i class="modalClose" id="modalSafeActClose"></i>
                    <div class="modalContent">
                        <div class="editTitle">사용자 정보변경</div>
                        <div class="editForm">
                            <span>이름</span>
                            <span>
                                <input class="eInput" id="edit-managerSafe" maxlength="16" readonly/>
                            </span>
                            <span>연락처</span>
                            <span>
                                <input class="eInput" id="edit-phoneSafe" maxlength="16"/>
                            </span>
                            <span>부서</span>
                            <span>
                                <input class="eInput" id="edit-partSafe" maxlength="16" />
                            </span>
                            <span>비밀번호 변경</span>
                            <span>
                                <input type="password" class="eInput" id="edit-passwdSafe" maxlength="16"/>
                            </span>
                            <span></span>
                            <span></span>
                            <span></span>
                            <span>※ 영문, 숫자, 특수문자 포함 8자리</span>
                        </div>
                    </div>
                    <div class="modalTool">
                      <span class="modalAct cancel" id="modalSafeActCancel">취소</span>
                      <span class="modalAct" id="modalSafeActDone">확인</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="includeFile" data-include="footer"></div>

</body>
</html>
