openapi: 3.1.0
info:
  title: SolarSimz 주요설비 API
  version: 1.0.0
  description: 대산금속 주요설비 등록, 조회, 수정, 삭제 및 복구 API
servers:
  - url: http://localhost:3456
security:
  - sessionCookie: []
paths:
  /api/tokens:
    post:
      summary: 로그인 및 HttpOnly 세션 발급
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 원본 대시보드 호환 로그인 응답과 세션 쿠키
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: 요청 출처 검증 실패
        "405":
          description: POST 이외의 요청 방식
        "422":
          $ref: "#/components/responses/ValidationError"
        "429":
          description: 로그인 시도 제한
  /api/auth/session:
    get:
      summary: 현재 로그인 사용자 조회
      responses:
        "200":
          description: 로그인 사용자
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/auth/logout:
    post:
      summary: 현재 세션 폐기
      responses:
        "200":
          description: 로그아웃 성공
  /api/gateways:
    get:
      summary: 게이트웨이와 공정 선택 데이터 조회
      responses:
        "200":
          description: 선택 데이터
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/facilities:
    get:
      summary: 설비 목록 조회
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 10 } }
        - { name: q, in: query, schema: { type: string, maxLength: 100 } }
        - { name: status, in: query, schema: { $ref: "#/components/schemas/FacilityStatus" } }
        - { name: controlMode, in: query, schema: { $ref: "#/components/schemas/ControlMode" } }
        - { name: processName, in: query, schema: { type: string, maxLength: 50 } }
        - { name: gatewayId, in: query, schema: { type: string, format: uuid } }
        - { name: deleted, in: query, schema: { type: string, enum: [exclude, only, include], default: exclude } }
        - { name: sort, in: query, schema: { type: string, enum: [updatedAt, createdAt, name, code, priority, processName] } }
        - { name: order, in: query, schema: { type: string, enum: [asc, desc] } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: 페이지네이션된 설비 목록
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FacilityListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/ValidationError"
    post:
      summary: 설비 등록
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FacilityInput"
      responses:
        "201":
          description: 등록 성공
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FacilityResponse"
        "409":
          description: 설비 코드 또는 활성 게이트웨이 연결 위치 중복
        "413":
          description: 64KB를 초과한 요청 본문
        "415":
          description: application/json이 아닌 요청
        "422":
          $ref: "#/components/responses/ValidationError"
  /api/facilities/{id}:
    parameters:
      - $ref: "#/components/parameters/FacilityId"
    get:
      summary: 설비 상세 조회
      parameters:
        - name: includeDeleted
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: 설비 상세
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FacilityResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      summary: 설비 부분 수정
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FacilityPatch"
      responses:
        "200":
          description: 수정 성공
        "409":
          description: 버전 충돌 또는 삭제 데이터
        "422":
          $ref: "#/components/responses/ValidationError"
    delete:
      summary: 설비 소프트 삭제
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VersionRequest"
      responses:
        "200":
          description: 삭제 성공 또는 이미 삭제된 데이터
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: 버전 충돌
  /api/facilities/{id}/restore:
    parameters:
      - $ref: "#/components/parameters/FacilityId"
    post:
      summary: 삭제 설비 복구
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VersionRequest"
      responses:
        "200":
          description: 복구 성공 또는 이미 복구된 데이터
        "409":
          description: 버전 또는 활성 게이트웨이 연결 위치 충돌
  /api/facilities/{id}/purge:
    parameters:
      - $ref: "#/components/parameters/FacilityId"
      - name: x-confirm-purge
        in: header
        required: true
        schema: { type: string, pattern: "^[A-Z0-9_-]{2,32}$" }
    delete:
      summary: 관리자 전용 영구 삭제
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [code, version]
              properties:
                code: { type: string, pattern: "^[A-Z0-9_-]{2,32}$" }
                version: { type: integer, minimum: 1 }
      responses:
        "200":
          description: 영구 삭제 성공
        "400":
          description: 확인 헤더 불일치
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: 소프트 삭제되지 않은 설비
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: solar_session
  parameters:
    FacilityId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    LoginRequest:
      type: object
      required: [cf, id, pw]
      additionalProperties: false
      properties:
        cf: { const: login }
        id: { type: string, minLength: 1, maxLength: 80 }
        pw: { type: string, minLength: 1, maxLength: 256 }
    LoginResponse:
      type: object
      required: [token, authIdn, authName, fid, firmName, role, members]
      properties:
        token: { type: string }
        authIdn: { type: string, format: uuid }
        authName: { type: string }
        fid: { type: [string, integer] }
        firmName: { type: string }
        role: { type: string, enum: [ADMIN, OPERATOR, VIEWER] }
        members:
          type: array
          description: 현재 테넌트에 속한 업체 선택 항목만 반환
          items:
            type: object
            additionalProperties: true
    FacilityStatus:
      type: string
      enum: [ACTIVE, INACTIVE]
    ControlMode:
      type: string
      enum: [AUTO, MANUAL]
    FacilityInput:
      type: object
      additionalProperties: false
      required:
        - code
        - name
        - processName
        - priority
        - baseTemperature
        - peakControlPercent
      properties:
        code:
          type: string
          pattern: "^[A-Za-z0-9_-]{2,32}$"
        name: { type: string, minLength: 2, maxLength: 80 }
        processName: { type: string, minLength: 2, maxLength: 50 }
        groupName: { type: string, maxLength: 50, default: "" }
        priority: { type: integer, minimum: 0, maximum: 254 }
        baseTemperature: { type: number, minimum: 0, maximum: 999 }
        peakControlPercent: { type: number, minimum: 0, maximum: 100 }
        gatewayId:
          oneOf:
            - { type: string, format: uuid }
            - { type: "null" }
        nodeNumber:
          oneOf:
            - { type: integer, minimum: 1, maximum: 10 }
            - { type: "null" }
        channelNumber:
          oneOf:
            - { type: integer, minimum: 1, maximum: 32 }
            - { type: "null" }
        controlMode: { $ref: "#/components/schemas/ControlMode" }
        status: { $ref: "#/components/schemas/FacilityStatus" }
    Facility:
      allOf:
        - $ref: "#/components/schemas/FacilityInput"
        - type: object
          required: [id, version, createdAt, createdBy, updatedAt, updatedBy]
          properties:
            id: { type: string, format: uuid }
            gatewayCode: { type: [string, "null"] }
            gatewayName: { type: [string, "null"] }
            version: { type: integer, minimum: 1 }
            createdAt: { type: string, format: date-time }
            createdBy: { type: string, format: uuid }
            createdByName: { type: string }
            updatedAt: { type: string, format: date-time }
            updatedBy: { type: string, format: uuid }
            updatedByName: { type: string }
            deletedAt: { type: [string, "null"], format: date-time }
            deletedBy: { type: [string, "null"], format: uuid }
            deletedByName: { type: [string, "null"] }
    FacilityPatch:
      type: object
      additionalProperties: false
      required: [version]
      minProperties: 2
      properties:
        version: { type: integer, minimum: 1 }
        name: { type: string, minLength: 2, maxLength: 80 }
        processName: { type: string, minLength: 2, maxLength: 50 }
        groupName: { type: string, maxLength: 50 }
        priority: { type: integer, minimum: 0, maximum: 254 }
        baseTemperature: { type: number, minimum: 0, maximum: 999 }
        peakControlPercent: { type: number, minimum: 0, maximum: 100 }
        gatewayId:
          oneOf:
            - { type: string, format: uuid }
            - { type: "null" }
        nodeNumber:
          oneOf:
            - { type: integer, minimum: 1, maximum: 10 }
            - { type: "null" }
        channelNumber:
          oneOf:
            - { type: integer, minimum: 1, maximum: 32 }
            - { type: "null" }
        controlMode: { $ref: "#/components/schemas/ControlMode" }
        status: { $ref: "#/components/schemas/FacilityStatus" }
    VersionRequest:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { type: integer, minimum: 1 }
    PaginationMeta:
      type: object
      required: [page, limit, total, totalPages]
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
    Error:
      type: object
      required: [ok, requestId, error]
      properties:
        ok: { const: false }
        requestId: { type: string, minLength: 8, maxLength: 100 }
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            fieldErrors:
              type: object
              additionalProperties:
                type: array
                items: { type: string }
    FacilityResponse:
      type: object
      required: [ok, requestId, data]
      properties:
        ok: { const: true }
        requestId: { type: string, minLength: 8, maxLength: 100 }
        data: { $ref: "#/components/schemas/Facility" }
    FacilityListResponse:
      type: object
      required: [ok, requestId, data]
      properties:
        ok: { const: true }
        requestId: { type: string, minLength: 8, maxLength: 100 }
        data:
          type: object
          required: [items, meta]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/Facility" }
            meta: { $ref: "#/components/schemas/PaginationMeta" }
    SessionResponse:
      type: object
      properties:
        ok: { const: true }
        requestId: { type: string }
        data:
          type: object
          properties:
            id: { type: string, format: uuid }
            tenantId: { type: string }
            username: { type: string }
            name: { type: string }
            role: { type: string, enum: [ADMIN, OPERATOR, VIEWER] }
  responses:
    Unauthorized:
      description: 로그인 필요
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: 권한 없음
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: 설비 없음 또는 다른 테넌트 데이터
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationError:
      description: 입력 검증 실패
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
