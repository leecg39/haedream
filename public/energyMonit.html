<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>공정별 에너지 계통</title>
    <link rel="shortcut icon" href="./assets/img/favicon.ico">
    <link rel="stylesheet" href="./assets/css/lib/tui-date-picker.css">
    <script src="./assets/js/lib/xlsx.full.min.js"></script>
    <link href="./assets/css/lib/select2.min.css" rel="stylesheet">
    <script src="./assets/js/jquery.min.js"></script>
    <script src="./assets/js/lib/select2.min.js"></script>
    <script src="./assets/js/lib/tui-date-picker.js"></script>
    <link rel="stylesheet" type="text/css" href="./assets/css/common.css?v=0.0.1">
    <link rel="stylesheet" type="text/css" href="./assets/css/energyMonit.css?v=0.0.1">
    <script type="text/javascript" src="./assets/js/base.js?v=0.0.1"></script>
    <script type="text/javascript" src="./assets/js/energyMonit.js?v=0.0.2"></script>
    <script defer src="./assets/js/agentation-loader.js"></script>
</head>
<body id="dashboard" class="darkmode">
<div class="mobileOverlay">
    <div class="mobileBg"></div>
    <div class="mobileNavbg"></div>
</div>
<div class="container">
    <div class="bdRight" id="leftnav">
        <div class="includeFile" data-include="leftNav"></div>
    </div>
    <div class="contentsArea">
        <div class="topBar" id="topBar"></div>
        <main class="contents" id="contentsArea">
            <h1 class="deskTitle" >공정별 에너지 계통</h1>
            <div class="sheetArea">
                <div class="divProcBox">
                    <div class="divProc">
                        <ul class="dep1" id="tree"></ul>
                        <div class="disable" id="notFoundData">등록된 데이터가 없습니다.</div>
                    </div>
                    <div class="btnArea">
                        <a href="/setEnergyMonit.html" class="edit">
                            <i class="bi bi-pencil-square"></i>공정분류 변경
                        </a>
                        <a href="javascript:void(0)" class="edit editInfo" onclick="vio.showPopup()">
                            <i class="bi bi-file-earmark-text"></i>변경이력 조회
                        </a>
                    </div>
                </div>
                <!-- 에너지 공정 계통 -->
                <div class="divMonit">
                    <div class="deskTool">
                        <div class="mTBlock">
                            <span class="deskLabel">에너지원</span>
                            <select class="select" id="energySelect">
                                <option value="">전체</option>
                                <option value="1">전력</option>
                                <option value="2">도시가스</option>
                                <option value="3">용수</option>
                            </select>
                        </div>
                        <div class="mTBlock r2">
                            <span class="deskLabel">기간</span>
                            <div class="datePicker">
                                <div class="tui-datepicker-input tui-datetime-input tui-has-focus">
                                    <input type="text" class="inputDate" id="sDate" aria-label="Date-Time" readonly>
                                    <i class="bi bi-calendar"></i>
                                </div>
                                <div id="sDateWrapper"></div>
                            </div>
                            <span class="deskDash">~</span>
                            <div class="datePicker">
                                <div class="tui-datepicker-input tui-datetime-input tui-has-focus">
                                    <input type="text" class="inputDate" id="eDate" aria-label="Date-Time" readonly>
                                    <i class="bi bi-calendar"></i>
                                </div>
                                <div id="eDateWrapper"></div>
                            </div>
                        </div>
                        <div class="mTBlock">
                            <span class="act actIcon" id="act" onclick="vio.getData()">
                                <i class="bi bi-search"></i>
                                <span>조회</span>
                            </span>
                            <span class="act actIcon" id="actExcelSave">
                                <i class="bi bi-file-earmark-excel-fill excel"></i>
                                <span>엑셀로 다운</span>
                            </span>
                        </div>
                        <div class="mTBlock ck disable">
                            <input type="checkbox" class="check" id="simple">
                            <label for="simple">간략히보기</label>
                        </div>
                    </div>
                    <div class="ProseccScroll">
                        <div class="ProseccWrap">
                            <!-- 에너지원 종류 -->
                            <div class="monitBox">
                                <ul class="energyIcon">
                                    <li class="energyTitle light selectWatt" id="wattWrap">
                                        <img src="./assets/img/energy1.png" alt="전력 아이콘">
                                        <span class="pipeLine disable" id="pipeLineWatt"></span>
                                    </li>
                                    <li class="energyTitle gas selectGas" id="gasWrap">
                                        <img src="./assets/img/energy2.png" alt="가스 아이콘">
                                        <span class="pipeLine disable" id="pipeLineGas"></span>
                                    </li>
                                    <li class="energyTitle water selectWater" id="waterWrap">
                                        <img src="./assets/img/energy3.png" alt="용수 아이콘">
                                        <span class="pipeLine disable" id="pipeLineWater"></span>
                                    </li>
                                </ul>
                                <ul class="energyData">
                                    <li class="energyWatt selectWatt wattColor">
                                        <div class="titleName">
                                            <span class="title">전력</span>
                                            <span id="wattTotal">-</span>
                                            <span class="unit">kWh</span>
                                        </div>
                                    </li>
                                    <li class="energyGas selectGas gasColor">
                                        <div class="titleName">
                                            <span class="title">도시가스</span>
                                            <span id="gasTotal">-</span>
                                            <span class="unit">Nm³</span>
                                        </div>
                                    </li>
                                    <li class="energyWater selectWater waterColor">
                                        <div class="titleName">
                                            <span class="title">용수</span>
                                            <span id="waterTotal">-</span>
                                            <span class="unit">ton</span>
                                        </div>
                                    </li>
                                </ul>
                            </div>
                            <!-- 에너지원 종류 / -->
                            <!-- 공정  -->
                            <div class="monitCont mainCont" id="monitCont"></div>
                            <!-- 공정  / -->
                        </div>
                    </div>
                </div>
                <!-- 에너지 공정 계통 /-->
            </div>
        </main>
    </div>
</div>

<div class="includeFile" data-include="footer"></div>
<!-- 변경이력 팝업 -->
<div class="disable" id="modal">
    <div class="modal">
        <div class="modalBox">
            <i class="modalClose" id="modalActClose" onclick="vio.hidePopup()"></i>
            <div class="modalContent">
                <div class="deskTool pop">
                    <div class="left">
                        <div class="deskTitle">변경이력 조회</div>
                        <div class="srchBox">
                            <div class="mTBlock">
                                <div class="datePicker">
                                    <div class="tui-datepicker-input tui-datetime-input tui-has-focus">
                                        <input type="text" class="inputDate" id="historySDate" aria-label="Date-Time" readonly>
                                        <i class="bi bi-calendar"></i>
                                    </div>
                                    <div id="historySDateWrapper"></div>
                                </div>
                                <span class="deskDash">~</span>
                                <div class="datePicker">
                                    <div class="tui-datepicker-input tui-datetime-input tui-has-focus">
                                        <input type="text" class="inputDate" id="historyEDate" aria-label="Date-Time" readonly>
                                        <i class="bi bi-calendar"></i>
                                    </div>
                                    <div id="historyEDateWrapper"></div>
                                </div>
                            </div>
                            <span class="act actIcon" id="historysAct">
                                <i class="bi bi-search"></i>
                                <span>조회</span>
                            </span>
                        </div>
                    </div>
                </div>
                <div class="sheetWrap" id="sheetWrap">
                    <table class="sheet editHistory">
                        <thead>
                            <tr>
                                <th>날짜</th>
                                <th>시간</th>
                                <th>담당자</th>
                                <th>항목</th>
                                <th class="center">변경내용</th>
                            </tr>
                        </thead>
                        <tbody id="historys"></tbody>
                    </table>
                    <span class="disable" id="notFoundHistorys">변경이력이 없습니다.</span>
                </div>
                <div class="deskStat">
                    <div class="deskLimit">
                        <span class="deskLabel" id="deskStat">0 - 0 / 0</span>
                    </div>
                    <div class="deskPages" id="deskPages">
                        <span class="deskPage act">prev</span>
                        <span class="deskPage act active">1</span>
                        <span class="deskPage act">next</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- 변경이력 팝업 / -->
</body>
</html>
