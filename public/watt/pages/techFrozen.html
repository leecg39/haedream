<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>설비관리 - 냉난방 제어</title>
    <link rel="shortcut icon" href="./assets/img/favicon.ico">
    <link rel="stylesheet" href="./assets/css/lib/tui-date-picker.css">
    <script src="./assets/js/lib/tui-date-picker.js"></script>
    <link href="./assets/css/lib/select2.min.css" rel="stylesheet">
    <script src="./assets/js/jquery.min.js"></script>
    <script src="./assets/js/lib/select2.min.js"></script>
    <link rel="stylesheet" type="text/css" href="./assets/css/common.css?v=0.0.1">
    <link rel="stylesheet" type="text/css" href="./assets/css/deskLib.css?v=0.0.1">
    <link rel="stylesheet" type="text/css" href="./assets/css/techFrozen.css?v=0.0.1">
    <script type="text/javascript" src="./assets/js/base.js?v=0.0.1"></script>
    <script type="text/javascript" src="./assets/js/techFrozen.js?v=0.0.2"></script>
</head>
<body id="dashboard" class="darkmode">
<div class="mobileOverlay">
    <div class="mobileBg"></div>
    <div class="mobileNavbg"></div>
</div>
<div class="container">
    <div class="bdRight" id="leftnav"></div>
    <div class="contentsArea">
        <div class="topBar" id="topBar"></div>
        <main class="contents disable" id="contentsArea">
            <div class="kfeHead deskTitle">
                <span class="kfeHeadLabel">냉난방 제어</span>
                <span class="kfeHeadSub">
                <span class="menuName">냉방</span>
                <span class="toggle" id="deskType"></span>
                <span class="menuName">난방</span>
                <span class="deskLabel">도면그룹</span>
                <select class="deskSelect" id="deskGroup">
                    <option value="0">도면그룹 선택</option>
                </select>
            </span>
            </div>
            <div class="kfeContent">
                <div class="kfeBody">
                    <div class="frozen">
                        <div class="mapArea">
                            <div class="mapHead">
                                <span class="floorTitle" id="floorMapName"></span>
                            </div>
                            <div class="mapImageArea">
                                <img class="floorMapImage" id="floorMapImage" src="./assets/img/empty.png" alt="냉난방제어 도면"/>
                                <div class="mapPoints" id="floorMapPoints"></div>
                            </div>
                            <div class="mapDesk">
                                <span class="floorLabel" id="floorPlanName"></span>
                            </div>
                        </div>
                        <div class="deskArea">
                            <table class="desk" id="deskTable">
                                <thead>
                                    <tr id="deskSort">
                                        <th></th>
                                        <th class="sort" data-sort="itemType">분류</th>
                                        <th class="sort" data-sort="controlName">이름</th>
                                        <th class="sort" data-sort="controlStat">현재상태</th>
                                        <th>전압</th>
                                        <th>전류</th>
                                        <th>제어모드</th>
                                        <th>순위</th>
                                    </tr>
                                </thead>
                                <tbody id="deskList">
                                    <tr>
                                        <td></td>
                                        <td></td>
                                        <td></td>
                                        <td></td>
                                        <td></td>
                                        <td></td>
                                        <td></td>
                                        <td></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
        <div class="disable" id="modal">
            <div class="modal">
                <div class="modalBox">
                    <i class="modalClose" id="modalActClose"></i>
                    <div class="modalContent">
                        <div class="editTitle">냉난방 제어설정</div>
                        <div class="setAreaList">
                            <div class="setArea">
                                <div class="setLabel" data-name>수동제어 설정</div>
                                <div class="setItems">
                                    <div class="setItem">
                                        <span class="setItemAct" data-alt="ON" id="onControlAct">ON</span>
                                    </div>
                                    <div class="setItem">
                                        <span class="setItemAct" data-alt="OFF" id="offControlAct">OFF</span>
                                    </div>
                                </div>
                                <div class="setLabel">제어모드 변경</div>
                                <div class="setItems">
                                    <div class="setItem">
                                        <span class="setItemAct" data-alt="수동" id="manualControlAct">수동</span>
                                    </div>
                                    <div class="setItem">
                                        <span class="setItemAct" data-alt="자동" id="autoControlAct">자동</span>
                                    </div>
                                </div>
                                <div class="setLabel">우선순위</div>
                                <div class="setItems">
                                    <input type="number" class="eInput" id="edit-controlPriority" />
                                </div>
                            </div>
                            <div class="waitControlBox disable" id="waitControlBox">
                                <div class="waitCircle">
                                    <span class="waitCircleIcon rotate"></span>
                                    <span class="waitCircleText"></span>
                                </div>
                                <div class="waitText">제어요청 진행중입니다.</div>
                            </div>
                        </div>
                    </div>
                    <div class="modalTool">
                        <span class="modalAct" id="modalActDone">확인</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="includeFile" data-include="footer"></div>

</body>
</html>
