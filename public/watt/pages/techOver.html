<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>설비관리 - 주요설비 부하율</title>
    <link rel="shortcut icon" href="./assets/img/favicon.ico">
    <link rel="stylesheet" href="./assets/css/lib/tui-date-picker.css">
    <script src="./assets/js/lib/xlsx.full.min.js"></script>
    <script src="./assets/js/lib/amcharts/core.js"></script>
    <script src="./assets/js/lib/amcharts/charts.js"></script>
    <script src="./assets/js/lib/amcharts/themes/dark.js"></script>
    <link href="./assets/css/lib/select2.min.css" rel="stylesheet">
    <script src="./assets/js/jquery.min.js"></script>
    <script src="./assets/js/lib/select2.min.js"></script>
    <script src="./assets/js/lib/tui-date-picker.js"></script>
    <link rel="stylesheet" type="text/css" href="./assets/css/common.css?v=0.0.1">
    <link rel="stylesheet" type="text/css" href="./assets/css/deskLib.css?v=0.0.1">
    <link rel="stylesheet" type="text/css" href="./assets/css/techOver.css?v=0.0.1">
    <script type="text/javascript" src="./assets/js/base.js?v=0.0.1"></script>
    <script type="text/javascript" src="./assets/js/techOver.js?v=0.0.2"></script>
</head>
<body id="dashboard" class="darkmode">
<div class="mobileOverlay">
    <div class="mobileBg"></div>
    <div class="mobileNavbg"></div>
</div>
<div class="container">
    <div class="bdRight" id="leftnav"></div>
    <div class="contentsArea">
        <div class="topBar" id="topBar"></div>
        <main class="contents disable" id="contentsArea">
            <h1 class="deskTitle">주요설비 부하율</h1>
            <div class="chart1Area">
                <div class="itemList" id="itemList">
                    <div class="itemMain">MAIN</div>
                </div>
                <div class="chartbox">
                    <div class="deskTool">
                        <span class="deskLabel">기간</span>
                        <div class="datePicker">
                            <div class="tui-datepicker-input tui-datetime-input tui-has-focus">
                                <input type="text" class="inputDate" id="sDate" aria-label="Date-Time" readonly>
                                <i class="bi bi-calendar"></i>
                            </div>
                            <div id="sDateWrapper"></div>
                        </div>
                        <span class="deskDash">~</span>
                        <div class="datePicker">
                            <div class="tui-datepicker-input tui-datetime-input tui-has-focus">
                                <input type="text" class="inputDate" id="eDate" aria-label="Date-Time" readonly>
                                <i class="bi bi-calendar"></i>
                            </div>
                            <div id="eDateWrapper"></div>
                        </div>
                        <span class="act actIcon" id="act">
                        <i class="bi bi-search"></i>조회
                    </span>
                    </div>
                    <div class="chart1" id="chart1"></div>
                    <div class="chart1Extend" id="chart1Extend"></div>
                </div>
            </div>
        </main>
    </div>
</div>

<div class="includeFile" data-include="footer"></div>

</body>
</html>
