<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>설비관리 - 최적화 제어이력</title>
    <link rel="shortcut icon" href="./assets/img/favicon.ico">
    <link rel="stylesheet" href="./assets/css/lib/tui-date-picker.css">
    <script src="./assets/js/lib/xlsx.full.min.js"></script>
    <link href="./assets/css/lib/select2.min.css" rel="stylesheet">
    <script src="./assets/js/jquery.min.js"></script>
    <script src="./assets/js/lib/select2.min.js"></script>
    <script src="./assets/js/lib/tui-date-picker.js"></script>
    <link rel="stylesheet" type="text/css" href="./assets/css/common.css?v=0.0.1">
    <link rel="stylesheet" type="text/css" href="./assets/css/deskLib.css?v=0.0.1">
    <link rel="stylesheet" type="text/css" href="./assets/css/techHis.css?v=0.0.1">
    <script type="text/javascript" src="./assets/js/base.js?v=0.0.1"></script>
    <script type="text/javascript" src="./assets/js/techHis.js?v=0.0.2"></script>
    <script defer src="./assets/js/agentation-loader.js"></script>
    <link rel="stylesheet" type="text/css" href="./assets/css/leftnav-collapse.css?v=1.0.0">
    <script defer src="./assets/js/leftnav-collapse.js?v=1.0.0"></script>
</head>
<body id="dashboard" class="darkmode">
<div class="mobileOverlay">
    <div class="mobileBg"></div>
    <div class="mobileNavbg"></div>
</div>
<div class="container">
    <div class="bdRight" id="leftnav"></div>
    <div class="contentsArea">
        <div class="topBar" id="topBar"></div>
        <main class="contents disable" id="contentsArea">
            <h1 class="deskTitle">최적화 제어이력</h1>
            <div class="sheetArea">
                <div class="deskStatCenter">
                    <div class="deskLimit">
                        <span class="deskLabel">제어설비</span>
                        <select class="deskSelect" id="facList">
                            <option value="0">설비 선택</option>
                        </select>
                    </div>
                    <div class="deskPages">
                        <span class="deskLabel">날짜</span>
                        <div class="datePicker">
                            <div class="tui-datepicker-input tui-datetime-input tui-has-focus">
                                <input type="text" class="inputDate" id="sDate" aria-label="Date-Time" readonly>
                                <i class="bi bi-calendar"></i>
                            </div>
                            <div id="wrapper"></div>
                        </div>
                    </div>
                    <div class="deskTool" id="deskTool">
                        <span class="act actIcon" id="act">
                            <i class="bi bi-search"></i>
                            <span  data-lang="report012">조회</span>
                        </span>
                        <span class="deskAct act" data-act="excel">
                            <i class="bi bi-file-earmark-excel-fill excel"></i>엑셀로 다운
                        </span>
                        <span class="deskAct act" data-act="print">
                            <i class="bi bi-printer"></i>프린트
                        </span>
                    </div>
                </div>
                <div class="deskArea">
                    <table class="desk" id="deskTable">
                        <thead>
                            <tr id="deskSort">
                                <th>CID</th>
                                <th>제어설비</th>
                                <th>제어방법</th>
                                <th>제어시작</th>
                                <th>제어종료</th>
                                <th>제어시점 온도</th>
                                <th>종료시점 온도</th>
                                <th>제어시점 출력</th>
                                <th>종료시점 출력</th>
                                <th>제어설정</th>
                                <th>제어시간</th>
                                <th>절감전력</th>
                            </tr>
                        </thead>
                        <tbody id="deskList">
                            <tr>
                                <td>-</td>
                                <td>-</td>
                                <td>-</td>
                                <td>-</td>
                                <td>-</td>
                                <td>-</td>
                                <td>-</td>
                                <td>-</td>
                                <td>-</td>
                                <td>-</td>
                                <td>-</td>
                                <td>-</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="deskStat">
                    <div class="deskLimit">
                        <span class="deskLabel" id="deskStat">1 - 5 / 5</span>
                    </div>
                    <div class="deskPages" id="deskPages">
                        <span class="deskPage act">prev</span>
                        <span class="deskPage act active">1</span>
                        <span class="deskPage act">next</span>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<div class="includeFile" data-include="footer"></div>

</body>
</html>
