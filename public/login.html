<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>한국미래에너지</title>
    <link rel="shortcut icon" href="./assets/img/favicon.ico">
    <script src="./assets/js/jquery.min.js"></script>
    <link rel="stylesheet" type="text/css" href="./assets/css/common.css?v=0.0.1">
    <link rel="stylesheet" type="text/css" href="./assets/css/login.css?v=0.0.1">
    <script type="text/javascript" src="./assets/js/base.js?v=0.0.1"></script>
    <script type="text/javascript" src="./assets/js/login.js?v=0.0.2"></script>
    <script defer src="./assets/js/agentation-loader.js"></script>
</head>
<body class="logBody">
<div class="loginArea">
    <div class="loginBox" id="loginBox">
        <div class="left">
            <div class="titleBox disable" id="titleBox">
                <div class="titleT1">
                    <img src="./assets/img/login_toplogo.svg">
                </div>
                <div class="titleT2">ABC 에너지 통합관제 시스템</div>
            </div>
            <div class="logo" id="authLogo">
                <img src="./assets/img/empty.png" id="loginLogo">
            </div>
        </div>
        <div class="right loginForm">
            <div class="title">Login</div>
            <input type="text" id="authId" placeholder="아이디">
            <input type="password" id="authPasswd" placeholder="비밀번호">
            <div class="add">
                <div class="info">
                    <input type="checkbox" id="authIdSave">
                    <label for="authIdSave">아이디저장</label>
                </div>
                <!-- <a href="#">아이디비번찾기</a> -->
            </div>
            <button type="button" class="actLogin" id="actLogin">LOGIN</button>
        </div>
    </div>
</div>

<!-- 토스트 알람 -->
<div class="toastArea disable" id="toastArea">
    <div class="toast toastRed">
        <div class="textArea" id="toastText"></div>
    </div>
</div>
<!-- 토스트 끝 -->
</body>
</html>
