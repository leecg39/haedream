<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>절감효과</title>
    <link rel="shortcut icon" href="./assets/img/favicon.ico">
    <link rel="stylesheet" href="./assets/css/lib/tui-date-picker.css">
    <script src="./assets/js/lib/xlsx.full.min.js"></script>
    <script src="./assets/js/lib/amcharts/core.js"></script>
    <script src="./assets/js/lib/amcharts/charts.js"></script>
    <script src="./assets/js/lib/amcharts/themes/dark.js"></script>
    <script src="./assets/js/lib/amcharts/themes/animated.js"></script>
    <link href="./assets/css/lib/select2.min.css" rel="stylesheet">
    <script src="./assets/js/jquery.min.js"></script>
    <script src="./assets/js/lib/select2.min.js"></script>
    <script src="./assets/js/lib/tui-date-picker.js"></script>
    <link rel="stylesheet" type="text/css" href="./assets/css/common.css?v=0.0.1">
    <link rel="stylesheet" type="text/css" href="./assets/css/enpi.css?v=0.0.1">
    <script type="text/javascript" src="./assets/js/base.js?v=0.0.1"></script>
    <script type="text/javascript" src="./assets/js/enpi.js?v=0.0.2"></script>
</head>
<body id="dashboard" class="darkmode">
<div class="mobileOverlay">
    <div class="mobileBg"></div>
    <div class="mobileNavbg"></div>
</div>
<div class="container">
    <div class="bdRight" id="leftnav"></div>
    <div class="contentsArea">
        <div class="topBar" id="topBar"></div>
        <main class="contents disable" id="contentsArea">
            <h1 class="deskTitle">절감효과</h1>
            <div class="deskBooks">
                <div class="deskIndex">
                    <div class="enpiResult">
                        <div class="enpiReport">
                            <div class="enpiThis">
                                <span class="enpiText">에너지 사용량</span>
                                <div class="num">
                                    <span class="enpiTrue" id="enpiThis">0.00</span>
                                    <span class="enpiText2">toe</span>
                                </div>
                            </div>
                            <div class="enpiLast">
                                <div>
                                    <span class="enpiText">지난주 대비</span>
                                    <span class="enpiTrue" id="enpiLastWeek">-</span>
                                </div>
                                <div>
                                    <span class="enpiText">지난달 대비</span>
                                    <span class="enpiTrue" id="enpiLastMonth">-</span>
                                </div>
                                <div>
                                    <span class="enpiText">지난해 대비</span>
                                    <span class="enpiTrue" id="enpiLastYear">-</span>
                                </div>
                            </div>
                            <div class="enpiToe">
                                <span class="enpiText">에너지 절감량</span>
                                <div class="num">
                                    <span class="enpiTrue" id="enpiEffect">0.00</span>
                                    <span class="enpiText2">toe</span>
                                </div>
                            </div>
                            <div class="enpiOut">
                                <div>
                                    <span class="enpiText">누적 개선율</span>
                                    <span class="enpiTrue"><span id="enpiEffectAccu">0.00</span><span class="enpiText">%</span></span>
                                </div>
                                <div>
                                    <span class="enpiText">에너지 절감비용</span>
                                    <span class="enpiTrue"><span id="enpiEffectMoney">0.00</span><span class="enpiText">만원</span></span>
                                </div>
                                <div>
                                    <span class="enpiText">온실가스 절감량</span>
                                    <span class="enpiTrue"><span id="enpiEffectGas">0.00</span><span class="enpiText">tCo₂</span></span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="deskContent">
                    <div class="deskTool">
                        <div class="mTBlock">
                            <span class="deskLabel">날짜</span>
                            <div class="datePicker">
                                <div class="tui-datepicker-input tui-datetime-input tui-has-focus">
                                    <input type="text" class="inputDate" id="inputMonth" aria-label="Date-Time" readonly>
                                    <i class="bi bi-calendar"></i>
                                </div>
                                <div id="wrapper"></div>
                            </div>
                            <span class="act actIcon" id="act">
                                <i class="bi bi-search"></i>조회
                            </span>
                        </div>
                        <div class="mTBlock">
                            <span class="act actIcon" id="actExcelExam" title="EnPI 에너지원 엑셀데이터 파일 다운로드">
                                <i class="bi bi-file-earmark-arrow-down excel"></i>샘플받기
                            </span>
                            <span class="act actIcon" id="actExcelImport" title="EnPI 에너지원 엑셀 데이터 파일 업로드">
                                <i class="bi bi-file-earmark-excel-fill excel"></i>파일등록
                            </span>
                            <input class="disable" id="fileExcelImport" type="file" accept=".xlsx" />
                        </div>
                    </div>
                    <div class="chart1" id="chart1"></div>
                    <div class="sheetArea sheetTwin">
                        <div class="sheetScroll">
                            <table class="sheet">
                                <thead class="sticky">
                                    <tr>
                                        <th rowspan="2">날짜</th>
                                        <th colspan="2">에너지원</th>
                                        <th colspan="2">에너지원 단위환산</th>
                                        <th colspan="2">탄소배출 단위환산</th>
                                        <th colspan="3">독립변수</th>
                                    </tr>
                                    <tr id="enpiEmLabel">
                                        <th>전력(소비기준)</th>
                                        <th>단위</th>
                                        <th>전력(소비기준)</th>
                                        <th>단위</th>
                                        <th>전력(소비기준)</th>
                                        <th>단위</th>
                                        <th>생산량 </th>
                                        <th>HDD</th>
                                        <th>CDD</th>
                                    </tr>
                                </thead>
                                <tbody id="itemList">
                                    <tr>
                                        <th class="tLabel">0000-00-00</th>
                                        <td></td>
                                        <td></td>
                                        <td></td>
                                        <td></td>
                                        <td></td>
                                        <td></td>
                                        <td></td>
                                        <td></td>
                                        <td></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                        <div class="sheetScroll">
                            <table class="sheet">
                                <thead>
                                    <tr class="sheetHead">
                                        <th>No.</th>
                                        <th>에너지원</th>
                                        <th>환산계수 toe</th>
                                        <th>단위</th>
                                        <th>에너지 전환효율</th>
                                        <th>배출계수 tCO₂</th>
                                        <th>단위</th>
                                        <th>선택</th>
                                    </tr>
                                </thead>
                                <tbody id="legendList">
                                    <tr>
                                        <th class="tLabel">1</th>
                                        <td></td>
                                        <td></td>
                                        <td></td>
                                        <td></td>
                                        <td></td>
                                        <td></td>
                                        <td></td>
                                    </tr>
                                    <tr>
                                        <th class="tLabel">2</th>
                                        <td></td>
                                        <td></td>
                                        <td></td>
                                        <td></td>
                                        <td></td>
                                        <td></td>
                                        <td></td>
                                    </tr>
                                    <tr>
                                        <th class="tLabel">3</th>
                                        <td></td>
                                        <td></td>
                                        <td></td>
                                        <td></td>
                                        <td></td>
                                        <td></td>
                                        <td></td>
                                    </tr>
                                    <tr>
                                        <th class="tLabel">4</th>
                                        <td></td>
                                        <td></td>
                                        <td></td>
                                        <td></td>
                                        <td></td>
                                        <td></td>
                                        <td></td>
                                    </tr>
                                    <tr>
                                        <th class="tLabel">5</th>
                                        <td></td>
                                        <td></td>
                                        <td></td>
                                        <td></td>
                                        <td></td>
                                        <td></td>
                                        <td></td>
                                    </tr>
                                    <tr>
                                        <th class="tLabel">6</th>
                                        <td></td>
                                        <td></td>
                                        <td></td>
                                        <td></td>
                                        <td></td>
                                        <td></td>
                                        <td></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<div class="includeFile" data-include="footer"></div>

</body>
</html>
